name: Supabase Migrations

on:
  pull_request:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.0

      - name: Link Supabase project
        shell: bash
        run: |
          rm -rf supabase/.temp
          supabase link \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --password "$SUPABASE_DB_PASSWORD" \
            --debug

      - name: Verify linked connection
        shell: bash
        run: |
          echo "Project ref: $(cat supabase/.temp/project-ref)"
          test "$(cat supabase/.temp/project-ref)" = "$SUPABASE_PROJECT_REF"

          echo "Supabase temporary connection files:"
          find supabase/.temp -maxdepth 1 -type f -printf "%f\n" | sort

      - name: List migrations
        run: supabase migration list --debug

      - name: Apply migrations dry run
        run: supabase db push --dry-run --debug

      - name: Diff check
        run: supabase db diff --linked --use-pg-schema --debug
