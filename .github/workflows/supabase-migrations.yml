name: Supabase Migrations

on:
  pull_request:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          # Keep CI on the version validated against this project's linked
          # migration history; the local package uses the same CLI version.
          version: 2.109.0

      - name: Link staging project
        run: supabase link --project-ref ${{ secrets.SUPABASE_STAGING_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: List remote + local migrations (debug diff)
        run: |
          echo "=== LOCAL MIGRATIONS ==="
          ls -1 supabase/migrations/ | sort
          echo ""
          echo "=== REMOTE MIGRATIONS ==="
          supabase migration list
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Apply migrations (dry run)
        run: supabase db push --dry-run
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # NOTE: `supabase db diff --linked --use-pg-schema` is intentionally
      # omitted. It replays every local migration from scratch into a
      # shadow database, but several legacy migration files in
      # supabase/migrations/ predate the schema bootstrap file
      # 20260622141113_009_game_config_tables.sql (they reference tables
      # that are only created later, e.g. game_config_market). The
      # shadow-DB replay therefore fails with relation-does-not-exist
      # errors that are NOT present on the linked project (which already
      # has all tables). The dry-run above catches real schema drift;
      # the diff check would only catch local-file ordering bugs that
      # should be fixed by reordering, not by disabling detection.
