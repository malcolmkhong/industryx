name: Supabase Migrations

on:
  pull_request:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_STAGING_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_STAGING_PROJECT_REF }}

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.111.0

      - name: Link Supabase project using IPv4 direct connection
        run: |
          rm -rf supabase/.temp
          # --skip-pooler forces a direct connection to the main Postgres
          # instance, avoiding the pgbouncer session-mode 15-client cap
          # that intermittently blocks `supabase link` on free-tier projects.
          supabase link --project-ref "$SUPABASE_PROJECT_REF" --skip-pooler

      - name: Verify linked project
        run: |
          echo "Linked project: $(cat supabase/.temp/project-ref)"
          test "$(cat supabase/.temp/project-ref)" = "$SUPABASE_PROJECT_REF"

      - name: List migrations
        run: supabase migration list

      - name: Apply migrations dry run
        run: supabase db push --dry-run

      - name: Diff check
        run: supabase db diff --linked --use-pg-schema
        if: always()
