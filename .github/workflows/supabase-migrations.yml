name: Supabase Migrations

on:
  pull_request:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Validate the migration files by replaying them on a fresh shadow DB
      # in CI. We bypass `supabase link` / `supabase db diff` because the
      # Supabase control-plane API reports `project is paused` even when the
      # data plane is healthy and reachable. The shadow-DB replay is the
      # actual validation we want.

      - name: Set up Postgres client
        run: |
          sudo apt-get update -y >/dev/null
          sudo apt-get install -y postgresql-client >/dev/null

      - name: Build shadow DB and replay migrations
        env:
          PGPASSWORD: shadow
        run: |
          set -euo pipefail
          # Start a local Postgres container acting as the shadow DB.
          docker run --rm -d --name industryx-shadow \
            -e POSTGRES_PASSWORD=shadow \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_DB=postgres \
            -p 55432:5432 \
            postgres:17 >/dev/null
          for i in $(seq 1 60); do
            if psql -h 127.0.0.1 -p 55432 -U postgres -d postgres \
                 -c 'SELECT 1' >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          psql -h 127.0.0.1 -p 55432 -U postgres -d postgres \
               -c 'SELECT version()' || {
            echo "::error::Shadow DB failed to start" >&2
            exit 1
          }
          # Stub the Supabase auth schema. The shadow DB is a plain Postgres
          # so we synthesize the parts of `auth.users` that early migrations
          # reference (id, created_at, is_anonymous, etc.). The canonical
          # Supabase auth schema is recreated by every fresh project; the
          # stub here is a no-op on real Supabase (where the schema is
          # already present).
          psql -h 127.0.0.1 -p 55432 -U postgres -d postgres <<'AUTH_STUB'
          CREATE SCHEMA IF NOT EXISTS auth;
          CREATE TABLE IF NOT EXISTS auth.users (
            id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
            email TEXT,
            is_anonymous BOOLEAN NOT NULL DEFAULT false,
            created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
            updated_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
          );
          CREATE OR REPLACE FUNCTION auth.uid() RETURNS uuid LANGUAGE sql STABLE AS $$
            SELECT NULL::uuid
          $$;
          CREATE OR REPLACE FUNCTION auth.role() RETURNS text LANGUAGE sql STABLE AS $$
            SELECT 'service_role'
          $$;
          CREATE OR REPLACE FUNCTION auth.jwt() RETURNS jsonb LANGUAGE sql STABLE AS $$
            SELECT '{}'::jsonb
          $$;
          CREATE SCHEMA IF NOT EXISTS extensions;
          CREATE EXTENSION IF NOT EXISTS pgcrypto WITH SCHEMA extensions;
          AUTH_STUB
          # Apply every migration in alphabetical order. We use plain
          # psql instead of `supabase db push` because the local
          # container is a plain Postgres, not a Supabase project.
          TOTAL=$(ls -1 supabase/migrations/*.sql | wc -l)
          APPLIED=0
          FAILED=0
          FAILED_LIST=""
          for f in $(ls -1 supabase/migrations/*.sql | sort); do
            name=$(basename "$f")
            if psql -h 127.0.0.1 -p 55432 -U postgres -d postgres \
                 -v ON_ERROR_STOP=1 -1 -f "$f" >/dev/null 2>"$name.err.log"; then
              APPLIED=$((APPLIED + 1))
            else
              FAILED=$((FAILED + 1))
              FAILED_LIST="$FAILED_LIST $name"
              echo "::error file=$f::migration failed; first 50 lines of stderr:"
              head -50 "$name.err.log" >&2
            fi
            rm -f "$name.err.log"
          done
          echo "Migrations applied: $APPLIED / $TOTAL, failed: $FAILED"
          if [ -n "$FAILED_LIST" ]; then
            echo "::error::Failed migrations:$FAILED_LIST"
            exit 1
          fi
          # Dump the final schema for archival.
          mkdir -p "$GITHUB_WORKSPACE/.shadow-out"
          pg_dump -h 127.0.0.1 -p 55432 -U postgres -d postgres \
            --schema-only --no-owner --no-privileges \
            > "$GITHUB_WORKSPACE/.shadow-out/shadow-schema.sql"
          echo "Shadow schema written to .shadow-out/shadow-schema.sql"
          docker stop industryx-shadow >/dev/null 2>&1 || true
