name: Supabase Migrations

on:
  pull_request:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          # Keep CI on the version validated against this project's linked
          # migration history; the local package uses the same CLI version.
          version: 2.109.0

      - name: Link staging project
        run: supabase link --project-ref ${{ secrets.SUPABASE_STAGING_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: List remote + local migrations (debug diff)
        run: |
          echo "=== LOCAL MIGRATIONS ==="
          ls -1 supabase/migrations/ | sort
          echo ""
          echo "=== REMOTE MIGRATIONS ==="
          supabase migration list

      - name: Apply migrations (dry run)
        run: supabase db push --dry-run

      - name: Diff check
        # `db diff` has no `--exit-code` flag. Use the linked schema diff
        # supported by the pinned CLI; GitHub's Ubuntu runner provides Docker
        # for the temporary shadow database it creates.
        run: supabase db diff --linked --use-pg-schema
