name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel previous in-flight runs on the same PR/branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  # ── Fast feedback loop: lint + typecheck in parallel ──
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Restore ESLint cache
        uses: actions/cache@v4
        with:
          path: .eslintcache
          key: eslint-${{ runner.os }}-${{ hashFiles('**/.eslintrc*', '**/eslint.config.*', 'src/**/*.{ts,tsx,js,jsx}') }}
          restore-keys: |
            eslint-${{ runner.os }}-

      - name: Run ESLint
        run: npm run lint

  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Restore TypeScript build info
        uses: actions/cache@v4
        with:
          path: |
            *.tsbuildinfo
            .tsbuildinfo
          key: tsbuildinfo-${{ runner.os }}-${{ hashFiles('tsconfig.json', 'src/**/*.{ts,tsx}') }}
          restore-keys: |
            tsbuildinfo-${{ runner.os }}-

      - name: Run tsc --noEmit
        run: npx tsc --noEmit

  # ── Build (also catches any type errors that tsc --noEmit might miss) ──
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        run: npm run build
        env:
          # Skip telemetry during CI builds
          NEXT_TELEMETRY_DISABLED: '1'
          # Required at build time: next build evaluates API route modules
          # (page data collection). gameStateValidator.ts throws if this is
          # missing — fail-closed by design (AGENTS.md Security-First).
          # Also satisfies the legacy CHECKSUM_SECRET fallback in
          # /api/autonoma/route.ts — AUTONOMA_SIGNING_SECRET preferred but
          # the route accepts either name.
          CHECKSUM_SECRET: ${{ secrets.CHECKSUM_SECRET }}
          AUTONOMA_SHARED_SECRET: ${{ secrets.AUTONOMA_SHARED_SECRET }}
          AUTONOMA_SIGNING_SECRET: ${{ secrets.CHECKSUM_SECRET }}

  # ── Test suite (integration + security) ──
  test:
    name: Test suite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
        env:
          # The anon key is public by design (designed for browser bundles).
          # Required by tests/integration/supabase-connectivity.test.ts.
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: https://wkkzqtseqwcyyyezroqq.supabase.co
          # Live HTTP tests hit production endpoints. CI runs them in skip
          # mode (RUN_LIVE_TESTS unset) to avoid flakiness and rate-limit
          # tripping. Set to "1" in a manual dispatch to run them against
          # staging or production.
          RUN_LIVE_TESTS: ${{ vars.RUN_LIVE_TESTS || '0' }}
          BASE_URL: ${{ vars.BASE_URL || '' }}
          NEWS_GENERATOR_URL: ${{ vars.NEWS_GENERATOR_URL || '' }}

      - name: Run security tests
        run: npm run test:security
        continue-on-error: false
        env:
          RUN_LIVE_TESTS: ${{ vars.RUN_LIVE_TESTS || '0' }}
          BASE_URL: ${{ vars.BASE_URL || '' }}

  # ── Design-system CI gate (prevents design-token regressions) ──
  ci-gate:
    name: Design-system gate
    runs-on: ubuntu-latest
    timeout-minutes: 3
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history for git diff against origin/main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run design-system CI gates
        # Only run on PRs (we need a diff to check). On push to main, skip.
        if: github.event_name == 'pull_request'
        run: bash planning/CI_GATES.sh origin/${{ github.base_ref }}

  # ── Aggregate gate: everything must pass before merge ──
  all-pass:
    name: All checks passed
    runs-on: ubuntu-latest
    needs: [lint, typecheck, build, test, ci-gate]
    if: ${{ always() }}
    steps:
      - name: Check all required jobs succeeded
        run: |
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ] || \
             [ "${{ contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "One or more required jobs failed or were cancelled"
            exit 1
          fi
          echo "All checks passed ✓"
